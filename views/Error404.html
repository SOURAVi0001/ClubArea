<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Not Reachable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Rubik+Glitch&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff6ec4, #7873f5);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Fredoka', sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .container {
      padding: 3rem 4rem;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 2rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      font-family: 'Rubik Glitch', cursive;
      color: #ffea00;
    }

    .emoji {
      font-size: 3rem;
      animation: bounce 1s infinite;
    }

    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.6rem;
      background-color: #ffffff22;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 1rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #fff;
      color: #443C68;
      transform: scale(1.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>This URL is not reachable!! <span class="emoji">🤣🤣🤣</span></h1>
    <a href="/" class="btn">Go Back Home</a>
  </div>

  <script>
    console.log("Lost? Don't worry, we'll get you back.");
  </script>
</body>
</html>
